# Pane Topic Sync -- configuration
#
# Copy to your plugin config dir to customize:
#   ~/.config/herdr/plugins/config/dan.pane-topic-sync/config.toml
# (find it with: herdr plugin config-dir dan.pane-topic-sync)
#
# All keys are optional; omitted keys use the defaults shown below.

# Independently enable naming of panes and tabs.
sync_panes = true
sync_tabs  = true

# Never overwrite a pane or tab you renamed yourself. Once you rename one by
# hand, the plugin stops managing that pane/tab entirely -- its name is yours
# until you hand it back:
#   pane -> herdr pane rename <pane_id> --clear   (clears the label)
#   tab  -> rename it to its tab number, e.g. "2" (tabs have no --clear)
# Set false for the old behavior, where every label is overwritten on the next
# event.
respect_manual_names = true

# Per-kind overrides for the flag above. Unset (the default) inherits it.
# Useful when one kind needs the opposite policy: another plugin that renames
# tabs itself (herdr-deck renames every tab it creates) would otherwise get
# those tabs treated as hand-named and locked out of topic syncing for good,
# while you still want your own pane names to stick.
#   respect_manual_pane_names = true
#   respect_manual_tab_names  = false

# Which pane's topic names a multi-pane tab:
#   "first"  = the top-left pane (reading order)
#   "active" = the pane you last focused *within that tab* (herdr tracks this
#              per tab, so it does not jump around with your global cursor)
# Single-pane tabs use that pane either way.
tab_source = "first"

# Truncate labels longer than this (an ellipsis is appended). Applied AFTER
# formatting, so it caps the final label including any prefix.
max_label_length = 60

# Label templates. Tokens are substituted; unknown tokens are left literal.
#   {topic}     the agent's live topic (terminal_title_stripped)
#   {agent}     the agent name (e.g. "claude")
#   {workspace} the workspace label
#   {n}         tab switch number within its workspace (TABS ONLY)
#
# Examples:
#   tab_format  = "{n}· {topic}"     -> "1· Fix the parser bug"
#   pane_format = "{agent}: {topic}"      -> "claude: Fix the parser bug"
tab_format  = "{topic}"
pane_format = "{topic}"
